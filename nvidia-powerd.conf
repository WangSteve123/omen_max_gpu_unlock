<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus policy for nvidia-powerd (Dynamic Boost).
  Missing from the packaged files on this system; without it root cannot own
  nvidia.powerd.server and the daemon exits before negotiating the GPU budget.
-->
<busconfig>
	<policy user="root">
		<allow own="nvidia.powerd.server"/>
		<allow send_destination="nvidia.powerd.server"/>
	</policy>

	<policy context="default">
		<allow send_destination="nvidia.powerd.server"/>
	</policy>
</busconfig>
